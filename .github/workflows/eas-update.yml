name: EAS Over-The-Air (OTA) Live Update

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'index.js'
      - 'package.json'
      - 'app.json'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target EAS Update Channel'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      message:
        description: 'Update Message (e.g. Fix login button styling)'
        required: true
        default: 'Live OTA patch'

permissions:
  contents: read

concurrency:
  group: ota-${{ github.ref }}-${{ inputs.channel || 'preview' }}
  cancel-in-progress: true

jobs:
  ota-update:
    name: Publish Instant Live OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Quality & Bundle Compilation (Pre-publish Gate)
        run: |
          npx expo-doctor
          npx expo export --platform android

      - name: Verify EAS Authentication Secret
        id: check-auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ Expo EAS token is configured in repository secrets."
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice title=EAS Token Secret Notice::Repository secret EXPO_TOKEN or EAS_TOKEN is not configured in GitHub Secrets. Live OTA publish step skipped safely. Add EXPO_TOKEN to Settings -> Secrets and variables -> Actions to enable live EAS OTA deployments."
          fi

      - name: Setup EAS CLI
        if: steps.check-auth.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN }}

      - name: Publish Update to Target Channel
        if: steps.check-auth.outputs.has_token == 'true'
        run: |
          TARGET_CHANNEL="${{ inputs.channel || 'preview' }}"
          UPDATE_MSG="${{ inputs.message || github.event.head_commit.message || 'Live OTA code update' }}"
          echo "🚀 Publishing live OTA update to channel: $TARGET_CHANNEL"
          npx eas-cli update --channel "$TARGET_CHANNEL" --message "$UPDATE_MSG" --non-interactive
