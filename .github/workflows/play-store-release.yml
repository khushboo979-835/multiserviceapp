name: Google Play Internal Testing Release

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'EAS Build Profile to execute'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      auto_submit:
        description: 'Automatically submit generated AAB to Google Play Internal Testing track'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: Build & Deploy to Google Play Internal Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Quality Verification
        run: |
          npx expo-doctor
          npx expo export --platform android

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android Release Artifact via EAS Cloud
        id: eas-build
        run: |
          npx eas-cli build --platform android --profile ${{ inputs.build_profile }} --non-interactive

      - name: Submit to Google Play Internal Testing (Explicit Opt-in)
        if: ${{ inputs.auto_submit == true }}
        run: |
          npx eas-cli submit --platform android --profile production --track internal --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
